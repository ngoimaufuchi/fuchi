
name: Build Astro FUCHI


on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cai dat thu vien
        run: npm ci

      - name: Build website Astro
        run: npm run build

      - name: Luu website da build
        uses: actions/upload-artifact@v4
        with:
          name: fuchi-website
          path: dist/


      - name: Trien khai Astro len Mat Bao
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_HOST }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/
          server-dir: ./
          dry-run: false
